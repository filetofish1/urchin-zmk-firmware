# enable bluetooth
CONFIG_BT=y

# increase bluetooth signal power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# enable mouse movement, scrolling, and mouse buttons
CONFIG_ZMK_POINTING=y

# enable deep sleep support
CONFIG_ZMK_SLEEP=y

# enter deep sleep after 20 minutes
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1200000

# "Eager Debouncing"
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# --- DISPLAY SETTINGS ---

# enable display
CONFIG_ZMK_DISPLAY=y

# enable custom status screen
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# disable the stock nice!view status widget
CONFIG_NICE_VIEW_WIDGET_STATUS=n

# enable nice-view-strata
CONFIG_NICE_VIEW_STRATA=y

# disable the peripheral startup/connect animation
CONFIG_NICE_VIEW_STRATA_ANIMATION=n

# Show layers in numerical order from bottom to top
CONFIG_NICE_VIEW_STRATA_BASE_LAYER_SECOND=n
